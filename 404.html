<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>404 · 余白の向こう。</title>
  <script>(()=>{const s=localStorage.getItem('theme');document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')})()</script>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;padding:32px}.not-found-inner{width:min(100%,760px)}.not-found-code{margin:0 0 18px;color:var(--accent);font:.72rem var(--mono);letter-spacing:.12em}.not-found h1{margin:0;font-size:clamp(4rem,16vw,9rem);line-height:.9;letter-spacing:-.07em}.not-found p{max-width:560px;margin:28px 0;color:var(--muted);font-size:1rem;line-height:1.8}.not-found-actions{display:flex;flex-wrap:wrap;gap:12px}
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner section-reveal">
      <p class="not-found-code">信号丢失 / 404</p>
      <h1>这里<br />是空的。</h1>
      <p>这个地址没有对应页面。可能是链接已经失效，也可能这里只是一块真正的余白。</p>
      <div class="not-found-actions">
        <a class="button button-primary" href="./">← 返回主页</a>
        <button class="button button-ghost theme-toggle" type="button" aria-label="切换黑白主题"><span class="theme-icon">◐</span>切换主题</button>
      </div>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
